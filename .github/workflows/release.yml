name: release

# Push a tag such as v0.5.0 to publish Linux amd64/arm64 archives.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: build archives
        run: sh scripts/build-release.sh "${GITHUB_REF_NAME#v}"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --title "ROTUP $GITHUB_REF_NAME" --notes-file packaging/INSTALL.md $prerelease
